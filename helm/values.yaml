# Default values for mle-frontend (React SPA served by nginx)
# This is a YAML-formatted file; override as needed per environment

replicaCount: 2

image:
  repository: ghcr.io/runtime-software-development/mle-frontend
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-pull-secret
nameOverride: ""
fullnameOverride: ""

backend:
  apiService: mle-backend-mle-api-api-svc
  apiPort: 3000
  keycloakService: mle-backend-mle-api-keycloak-svc
  keycloakPort: 8081

appConfig:
  REACT_APP_BASEURL: "https://endpoint.mle.dev"
  REACT_APP_API_BASEURL: "https://endpoint.mle.dev/api"

nginxConfig: |
  log_format proxy_diagnostics '$time_iso8601 request_id=$request_id client=$remote_addr '
    'method=$request_method uri="$request_uri" status=$status req_len=$request_length '
    'bytes_sent=$body_bytes_sent req_time=$request_time '
    'upstream_addr="$upstream_addr" upstream_status="$upstream_status" '
    'upstream_connect_time="$upstream_connect_time" upstream_header_time="$upstream_header_time" '
    'upstream_response_time="$upstream_response_time"';

  access_log /var/log/nginx/access.log proxy_diagnostics;

  server {
    listen 8080;
    server_name localhost;

    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API calls from frontend
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://{{ .Values.backend.apiService }}:{{ .Values.backend.apiPort }};
        proxy_http_version 1.0;
        proxy_set_header Connection "close";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_next_upstream   error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        proxy_buffers         16 64k;
        proxy_buffer_size     64k;
        proxy_busy_buffers_size 128k;

        client_max_body_size 1000m;
        proxy_request_buffering off;
    }

    # Image/static assets served by API static mount
    location /uploads/ {
        proxy_pass http://{{ .Values.backend.apiService }}:{{ .Values.backend.apiPort }};
        proxy_http_version 1.0;
        proxy_set_header Connection "close";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;

        proxy_read_timeout    120s;
        proxy_next_upstream   error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_buffers         16 64k;
        proxy_buffer_size     64k;
        proxy_busy_buffers_size 128k;
    }

    # Keycloak proxy
    location /auth/ {
        resolver 10.96.0.10 valid=30s;
        set $keycloak_upstream http://{{ .Values.backend.keycloakService }}:{{ .Values.backend.keycloakPort }};
        proxy_pass $keycloak_upstream/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

serviceAccount:
  create: true
  automount: true
  name: ""

podAnnotations: {}
podLabels: {}

# To satisfy 'restricted' PSA
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  runAsNonRoot: true  # Required by your error log
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:     # Required by your error log
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: "traefik"
  annotations: {} # No middlewares needed!
  hosts:
    - host: endpoint.mle.dev
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: mle-frontend # All traffic goes here
              port:
                number: 80

resources:
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80  # optional

livenessProbe:
  httpGet:
    path: /
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: 8080
  initialDelaySeconds: 10

# Rolling update strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Node selector / affinity / tolerations (optional)
nodeSelector: {}
tolerations: []
affinity: {}
