server {
    listen 8080;
    server_name localhost;

    # Hide nginx version from response headers and error pages
    server_tokens off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self';" always;

    # Frontend Static Files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API Reverse Proxy
    location /api/ {
        # 'rewrite' strips the /api prefix before sending to Node
        rewrite ^/api/(.*) /$1 break;

        proxy_pass http://mle-backend-mle-api-api-svc:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep the upstream connection alive to avoid premature close (502s)
        proxy_set_header Connection "";

        # Allow slow upstream queries enough time to respond before nginx gives up
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;

        # Large response buffering — /api/nodes/map returns ~863KB.
        # 16 x 64KB buffers = 1MB in-memory before spilling to disk.
        proxy_buffers         16 64k;
        proxy_buffer_size     64k;
        proxy_busy_buffers_size 128k;
    }

    location /uploads/ {
        proxy_pass http://mle-backend-mle-api-api-svc:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout    120s;
        proxy_buffers         16 64k;
        proxy_buffer_size     64k;
        proxy_busy_buffers_size 128k;
    }
}